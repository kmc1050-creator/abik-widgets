<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해빗 트래커</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font-family: -apple-system, "Pretendard", "Malgun Gothic", sans-serif;
    background: #fffaf3;
    color: #3b2f2a;
  }
  .card {
    max-width: 460px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #f0e2cf;
    border-radius: 14px;
    padding: 16px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  #weekLabel { font-size: 13px; color: #7a6a60; margin-bottom: 10px; }
  input[type=text] {
    width: 100%;
    padding: 10px;
    font-size: 15px;
    border: 1px solid #e3d3bf;
    border-radius: 10px;
  }
  /* 요일 7칸 */
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; }
  .day {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 0; border-radius: 10px; background: #fff3e3; font-size: 12px;
    cursor: pointer; user-select: none;
  }
  .day.today { outline: 2px solid #e8913a; }
  .day input { width: 22px; height: 22px; accent-color: #e8913a; cursor: pointer; }
  #saveNotice { margin-top: 10px; font-size: 12px; color: #b5532b; min-height: 16px; }
</style>
</head>
<body>
  <div class="card">
    <h1>✅ 해빗 트래커</h1>
    <div id="weekLabel"></div>
    <input id="habitName" type="text" placeholder="습관 이름 (예: 물 2L 마시기)">
    <div class="days" id="days"></div>
    <div id="saveNotice"></div>
  </div>

<script>
  const DAY_NAMES = ["월", "화", "수", "목", "금", "토", "일"];
  const nameInput = document.getElementById("habitName");
  const daysBox = document.getElementById("days");
  const weekLabel = document.getElementById("weekLabel");
  const saveNotice = document.getElementById("saveNotice");

  // 날짜를 "2026-11-16"처럼 기기 현지 날짜 기준 글자로 바꾼다
  function ymd(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  // 이번 주 월요일 구하기 (getDay: 일=0, 월=1 ... 토=6)
  const today = new Date();
  const monday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));

  // 주마다 따로 저장하려고 저장 이름에 월요일 날짜를 넣는다
  const STORAGE_KEY = "habit-week-" + ymd(monday);

  // 저장된 기록 읽기 (저장이 막혀 있으면 빈 기록으로 시작)
  let canSave = true;
  let data = { name: "", checks: [false, false, false, false, false, false, false] };
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) data = JSON.parse(saved);
  } catch (e) {
    canSave = false;
  }

  function save() {
    if (!canSave) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      canSave = false;
      showSaveNotice();
    }
  }

  function showSaveNotice() {
    if (!canSave) saveNotice.textContent = "이 화면에서는 기록을 저장할 수 없어요. 새로고침하면 체크가 사라집니다.";
  }

  // 화면 그리기
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  weekLabel.textContent = "이번 주 " + (monday.getMonth() + 1) + "/" + monday.getDate() + " ~ " + (sunday.getMonth() + 1) + "/" + sunday.getDate();
  nameInput.value = data.name;

  for (let i = 0; i < 7; i++) {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    const cell = document.createElement("label");
    cell.className = "day" + (ymd(d) === ymd(today) ? " today" : "");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = !!data.checks[i];
    box.addEventListener("change", function () {
      data.checks[i] = box.checked; // 켜고 끄기
      save();
    });
    cell.innerHTML = "<b>" + DAY_NAMES[i] + "</b><span>" + (d.getMonth() + 1) + "/" + d.getDate() + "</span>";
    cell.appendChild(box);
    daysBox.appendChild(cell);
  }

  // 습관 이름은 칠 때마다 저장
  nameInput.addEventListener("input", function () {
    data.name = nameInput.value;
    save();
  });

  showSaveNotice();
</script>
</body>
</html>
